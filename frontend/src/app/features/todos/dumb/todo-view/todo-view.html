<mat-card>
	<mat-card-header>
		<mat-card-title class='title'>
			<a routerLink='/todo/{{todo().id}}'>
				{{todo().title}}
			</a>
		</mat-card-title>
	</mat-card-header>
	<div class="time">
		<mat-icon inline>calendar_today</mat-icon>
		<span>{{todo().createdAt | date}}</span>
	</div>
	<mat-card-content>
		<p [style.--max-lines]="max_lines_var()">{{todo().body}}</p>
	</mat-card-content>
</mat-card>
