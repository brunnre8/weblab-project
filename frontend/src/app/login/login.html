<form (submit)="onSubmit($event)" novalidate>
	<mat-form-field>
		<mat-label>Email</mat-label>
		<input matInput [formField]="loginForm.email" />
		@if (loginForm.email().touched() && loginForm.email().invalid()) {
		<mat-error>
			{{loginForm.email().errors()[0].message}}
		</mat-error>
		}
	</mat-form-field>

	<mat-form-field>
		<mat-label>Password</mat-label>
		<input matInput type="password" [formField]="loginForm.password" />
		@if (loginForm.password().touched() && loginForm.password().invalid()) {
		<mat-error>
			{{loginForm.password().errors()[0].message }}
		</mat-error>
		}
	</mat-form-field>
	<button matButton="filled" type="submit" [disabled]="!loginForm().valid()">Log In</button>
</form>
