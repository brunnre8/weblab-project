<form (submit)="onSubmit($event)">
	<mat-form-field>
		<mat-label>Email</mat-label>
		<input matInput type="email" [formField]="loginForm.email" />
		@if (loginForm.email().invalid()) {
		<!-- <mat-error>{{loginForm.email().errors()}}</mat-error> -->
		}
	</mat-form-field>

	<mat-form-field>
		<mat-label>Password</mat-label>
		<input matInput type="password" [formField]="loginForm.password" />
	</mat-form-field>
	<button matButton="filled" type="submit">Log In</button>
</form>
