@if(todo.isLoading()){
<div class='loader'>
	<mat-spinner [diameter]="50"></mat-spinner>
</div>
} @else if (todo.error()){
<p>{{todo.error()?.message ?? "unkown error"}}</p>
} @else if (todo.hasValue()){
<app-todo-full [todo]="todo.value()" [canDelete]="!deleteInFlight()" (onDelete)="onDelete($event)"
	(onEdit)="onEdit($event)"></app-todo-full>
}
