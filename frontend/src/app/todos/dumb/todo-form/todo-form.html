<form (submit)="onSubmit($event)" novalidate>
	<mat-form-field>
		<mat-label>Title</mat-label>
		<input matInput type="text" [formField]="todoForm.title" />
		@if (todoForm.title().touched() && todoForm.title().invalid()) {
		<mat-error>
			{{todoForm.title().errors()[0].message}}
		</mat-error>
		}
	</mat-form-field>

	<mat-form-field>
		<mat-label>Content</mat-label>
		<textarea matInput type="text" [formField]="todoForm.body"></textarea>
		@if (todoForm.body().touched() && todoForm.body().invalid()) {
		<mat-error>
			{{todoForm.body().errors()[0].message }}
		</mat-error>
		}
	</mat-form-field>
	<button matButton="filled" type="submit" [disabled]="!todoForm().valid()">Submit</button>
	<button matButton="outlined" type="button" (click)="onCancel($event)">Cancel</button>
</form>
